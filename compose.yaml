services:
  app:
    build: .
    env_file: .env
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: unless-stopped
    networks: [shared]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${SHARED_NETWORK:-360Network}
      - traefik.http.routers.paroquiaaqui-v2.rule=Host(`${APP_HOST:-v2.paroquiaaqui.com.br}`)
      - traefik.http.routers.paroquiaaqui-v2.entrypoints=websecure
      - traefik.http.routers.paroquiaaqui-v2.tls=true
      - traefik.http.services.paroquiaaqui-v2.loadbalancer.server.port=8000
  worker:
    build: .
    env_file: .env
    command: php artisan queue:work --sleep=1 --tries=3 --max-time=3600
    restart: unless-stopped
    networks: [shared]
  scheduler:
    build: .
    env_file: .env
    command: php artisan schedule:work
    restart: unless-stopped
    networks: [shared]

networks:
  shared:
    name: ${SHARED_NETWORK:-360Network}
    external: true
