services:
  app:
    build: .
    env_file: .env
    command: php artisan serve --host=0.0.0.0 --port=8000
    restart: unless-stopped
    ports:
      - "8000:8000"
  worker:
    build: .
    env_file: .env
    command: php artisan queue:work --sleep=1 --tries=3 --max-time=3600
    restart: unless-stopped
  scheduler:
    build: .
    env_file: .env
    command: php artisan schedule:work
    restart: unless-stopped
